<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} — Angeles Cibils Bernardes</title>
  <meta name="description" content="{{ page.excerpt | strip_html | truncate: 160 }}" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" />
</head>
<body>

  <nav>
    <a class="nav-name" href="/">Angeles Cibils Bernardes</a>
    <ul class="nav-links">
      <li><a href="/#about">About</a></li>
      <li><a href="/#worlds">Writing</a></li>
      <li><a href="/#systems">Systems</a></li>
      <li><a href="/#music">Music</a></li>
      <li><a href="/letters">Letters</a></li>
      <li><a href="/#contact">Contact</a></li>
    </ul>
  </nav>

  <div class="letter-page">
    <div class="letter-page-inner">

      <a class="letter-back" href="/letters">
        <i class="ti ti-arrow-left"></i> All letters
      </a>

      <header class="letter-header">
        <p class="letter-header-cat">{{ page.category }}</p>
        <h1 class="letter-header-title">{{ page.title }}</h1>
        <p class="letter-header-date">{{ page.date | date: "%B %d, %Y" }}</p>
      </header>

      <article class="letter-body">
        {{ content }}
      </article>

      <footer class="letter-footer">
        <p>— Angeles Cibils Bernardes</p>
        <a class="letter-back" href="/letters">
          <i class="ti ti-arrow-left"></i> Back to all letters
        </a>
      </footer>

    </div>
  </div>

  <footer>
    <span class="footer-name">Angeles Cibils Bernardes</span>
    <span class="footer-copy">© 2026 · All rights reserved</span>
  </footer>

</body>
</html>
